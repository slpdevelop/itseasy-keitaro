# Local development stack: PostgreSQL + FastAPI backend + React frontend.
# Run from backend/:  docker compose up -d --build
#
# Services:
#   postgres  - PostgreSQL 16 database
#   app       - FastAPI backend (port 8000)
#   frontend  - React + Vite served by nginx (port 5173, proxies /api to app)
#
# All secrets come from backend/.env (never baked into images).
services:
  postgres:
    image: postgres:16-alpine
    container_name: itseasy-keitaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-keitaro_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env (see .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-keitaro_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itseasy-keitaro-app
    restart: unless-stopped
    # All application settings come from backend/.env (never baked into the image).
    env_file:
      - .env
    environment:
      # Run against PostgreSQL in Compose (not SQLite).
      USE_POSTGRESQL: "True"
      # Compose service name is used as the database host.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # DSN assembled from individual variables so the real password stays out of the repo.
      POSTGRES_DB_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-keitaro_app}"
      # Frontend is served on http://localhost:5173 through the frontend service (nginx).
      # pydantic-settings parses list[str] env vars as JSON, so a JSON array is required.
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Apply pending Alembic migrations, then start the application.
    command: sh -c "alembic upgrade head && uvicorn app.asgi:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: itseasy-keitaro-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
