# Local development stack: PostgreSQL + FastAPI backend + React frontend.
# Run from backend/:  docker compose up -d --build
#
# ENV=development  -> live reload без пересборки (uvicorn --reload, Vite dev server)
# ENV=production   -> статичная сборка (nginx + uvicorn без --reload)
services:
  postgres:
    image: postgres:16-alpine
    container_name: itseasy-keitaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-keitaro_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-keitaro_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itseasy-keitaro-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: ${ENV:-development}
      USE_POSTGRESQL: "True"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-keitaro_app}"
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      # В разработке forza polling для отслеживания изменений через bind mount (Docker Desktop).
      WATCHFILES_FORCE_POLLING: "True"
    volumes:
      # Исходники подмонтированы для live reload. В production можно убрать эти три строки.
      - ./app:/app/app
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c 'alembic upgrade head &&
      if [ "$ENV" = "production" ]; then
        exec uvicorn app.asgi:app --host 0.0.0.0 --port 8000;
      else
        exec uvicorn app.asgi:app --reload --host 0.0.0.0 --port 8000;
      fi' 
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # target выбирается по ENV: development -> vite dev server, production -> nginx
      target: ${ENV:-production}
    container_name: itseasy-keitaro-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "/api/v1"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:80"
    volumes:
      # Исходники фронтенда для hot reload без пересборки образа
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
      - ../frontend/package.json:/app/package.json
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
